name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels: [feature, enhancement]
  - title: "🐞 Fixes"
    labels: [bugfix, fix]
  - title: "⚒️ Refactor"
    labels: [refactor]
  - title: "📂 Documentation"
    labels: [documentation]
  - title: "✅ Tests"
    labels: [tests]
  - title: "🔧 Maintenance"
    labels: [chore, build, ci, style, performance]
exclude-labels: [skip-changelog]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
version-resolver:
  major:
    labels: [major, breaking]
  minor:
    labels: [minor, feature, enhancement]
  patch:
    labels: [patch, bugfix, fix, chore, documentation, refactor, tests, style, performance, ci, build]
  default: patch
autolabeler:
  - label: feature
    title: ["/^feat(\\(.+\\))?:/"]
  - label: bugfix
    title: ["/^fix(\\(.+\\))?:/"]
  - label: documentation
    title: ["/^docs(\\(.+\\))?:/"]
  - label: refactor
    title: ["/^refactor(\\(.+\\))?:/"]
  - label: tests
    title: ["/^test(\\(.+\\))?:/"]
  - label: chore
    title: ["/^chore(\\(.+\\))?:/"]
  - label: ci
    title: ["/^ci(\\(.+\\))?:/"]
  - label: build
    title: ["/^build(\\(.+\\))?:/"]
  - label: performance
    title: ["/^perf(\\(.+\\))?:/"]
  - label: style
    title: ["/^style(\\(.+\\))?:/"]
  - label: major
    title: ["/^\\w+(\\(.+\\))?!:/"]
template: |
  ## What's changed

  $CHANGES
